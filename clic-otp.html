<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMU Clic - OTP Verification</title>
    <style>
        /* Reuse common styles for consistency */
        body { font-family: Arial, sans-serif; background-color: #f7f7f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        .logo { max-width: 150px; margin-bottom: 10px; }
        h1 { font-size: 24px; color: #333; margin-bottom: 15px; }
        .otp-instruction { font-size: 12px; text-align: left; color: #555; margin-bottom: 20px; line-height: 1.4; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        input[readonly] { background-color: #f0f0f0; cursor: not-allowed; }
        button.validate { width: 100%; padding: 12px; background-color: #333; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="OPSE_logo.png" alt="MMU Clic Logo" class="logo">
        <h1>CLiC</h1>

        <div class="otp-instruction">
            To complete **login process to CLiC**, please enter 6 digits OTP code provided to email muhammad.fayed.****@student.mmu.edu.my. <span style="color:#a00">Valid 10 minutes until <span id="current-time">00:00:00 AM</span>.</span>
        </div>

        <form id="otpForm">
            <div class="input-group">
                <label for="userId">User ID</label>
                <input type="text" id="userId" value="252FC252VP" readonly>
            </div>
            <div class="input-group">
                <label for="otpCode">OTP Code</label>
                <input type="text" id="otpCode" placeholder="Paste OTP Code Here" required maxlength="6" pattern="[0-9]*" inputmode="numeric">
            </div>
            <button type="submit" class="validate">Validate OTP</button>
        </form>
    </div>

    <script>
        // 1. Dynamic Time (Make it look valid 'right now')
        function updateTime() {
            const now = new Date();
            // Add 10 minutes for realism
            now.setMinutes(now.getMinutes() + 10);
            
            const timeString = now.toLocaleTimeString('en-MY', { 
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true 
            });
            const dateString = now.toLocaleDateString('en-MY'); // e.g., 31/03/2026

            document.getElementById('current-time').innerText = `${dateString} ${timeString}`;
        }
        updateTime(); // Run once on load

        // 2. MOCK LOGIC: *Any* OTP code entered leads to results
        document.getElementById('otpForm').addEventListener('submit', function(event) {
            event.preventDefault(); 
            const otpEntered = document.getElementById('otpCode').value;
            
            // Allow any input for realism during the test
            if (otpEntered.length === 6) {
                window.location.href = "result.html"; // The Real Magic
            } else {
                alert("The OTP code must be 6 digits.");
            }
        });
    </script>

</body>
</html>
